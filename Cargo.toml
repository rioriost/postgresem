[workspace]
members = [
    "crates/postgresem",
    "crates/postgresem-compiler",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/rioriost/postgresem"

[workspace.dependencies]
clap = { version = "4.5", features = ["derive"] }
fallible-iterator = "0.2"
postgres = { version = "0.19", features = ["with-serde_json-1"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
panic = "deny"
unwrap_used = "deny"
