name: postgresem

services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: postgresem_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD}
      POSTGRESEM_RUNTIME_PASSWORD: ${POSTGRESEM_RUNTIME_PASSWORD}
      POSTGRESEM_AUDIT_WRITER_PASSWORD: ${POSTGRESEM_AUDIT_WRITER_PASSWORD}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./fixtures/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgresem_dev"]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    image: postgres:18
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: postgresem_dev
      PGUSER: postgres
      PGPASSWORD: ${POSTGRES_SUPERUSER_PASSWORD}
    volumes:
      - ./migrations:/migrations:ro
    entrypoint: ["/bin/sh", "/migrations/run.sh"]

  seed:
    image: postgres:18
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: postgresem_dev
      PGUSER: postgres
      PGPASSWORD: ${POSTGRES_SUPERUSER_PASSWORD}
    volumes:
      - ./fixtures/semantic:/semantic:ro
    entrypoint: ["/bin/sh", "/semantic/run.sh"]

  gateway:
    build:
      context: .
      dockerfile: Containerfile
    # Apple Container's compose fallback must patch /etc/hosts before startup.
    user: "0"
    depends_on:
      seed:
        condition: service_completed_successfully
    environment:
      MCP_RUNTIME_DATABASE_URL: "host=db port=5432 dbname=postgresem_dev user=postgresem_runtime sslmode=disable"
      MCP_AUDIT_DATABASE_URL: "host=db port=5432 dbname=postgresem_dev user=postgresem_audit_writer sslmode=disable"
      POSTGRESEM_RUNTIME_PASSWORD: ${POSTGRESEM_RUNTIME_PASSWORD}
      POSTGRESEM_AUDIT_WRITER_PASSWORD: ${POSTGRESEM_AUDIT_WRITER_PASSWORD}
      POSTGRESEM_DB_ROLE: postgresem_analyst
      POSTGRESEM_MAX_RESULT_BYTES: "1048576"
      POSTGRESEM_STATEMENT_TIMEOUT_MS: "30000"
      POSTGRESEM_LOCK_TIMEOUT_MS: "5000"
      POSTGRESEM_IDLE_IN_TRANSACTION_SESSION_TIMEOUT_MS: "5000"
      POSTGRESEM_MCP_PROJECT: commerce
      POSTGRESEM_MCP_RUNTIME_URL_ENV: MCP_RUNTIME_DATABASE_URL
      POSTGRESEM_MCP_RUNTIME_PASSWORD_ENV: POSTGRESEM_RUNTIME_PASSWORD
      POSTGRESEM_MCP_AUDIT_URL_ENV: MCP_AUDIT_DATABASE_URL
      POSTGRESEM_MCP_AUDIT_PASSWORD_ENV: POSTGRESEM_AUDIT_WRITER_PASSWORD
      POSTGRESEM_MCP_DB_ROLE_ENV: POSTGRESEM_DB_ROLE
    entrypoint: ["/bin/sh", "-c"]
    command: ["exec gosu postgresem sleep infinity"]

  integration-test:
    image: postgres:18
    depends_on:
      seed:
        condition: service_completed_successfully
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: postgresem_dev
      PGUSER: postgres
      PGPASSWORD: ${POSTGRES_SUPERUSER_PASSWORD}
    volumes:
      - ./tests/integration:/tests:ro
    entrypoint: ["/bin/sh", "/tests/run.sh"]

  execution-test:
    build:
      context: .
      dockerfile: IntegrationContainerfile
    depends_on:
      seed:
        condition: service_completed_successfully
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: postgresem_dev
      PGUSER: postgres
      PGPASSWORD: ${POSTGRES_SUPERUSER_PASSWORD}
      POSTGRESEM_RUNTIME_PASSWORD: ${POSTGRESEM_RUNTIME_PASSWORD}
      POSTGRESEM_AUDIT_WRITER_PASSWORD: ${POSTGRESEM_AUDIT_WRITER_PASSWORD}
      POSTGRESEM_DB_ROLE: postgresem_analyst
      POSTGRESEM_MAX_RESULT_BYTES: "1048576"
      POSTGRESEM_STATEMENT_TIMEOUT_MS: "30000"
      POSTGRESEM_LOCK_TIMEOUT_MS: "5000"
      POSTGRESEM_IDLE_IN_TRANSACTION_SESSION_TIMEOUT_MS: "5000"
    volumes:
      - ./tests/integration:/tests:ro
    entrypoint: ["/bin/sh", "/tests/execution.sh"]

  mcp-test:
    build:
      context: .
      dockerfile: IntegrationContainerfile
    depends_on:
      seed:
        condition: service_completed_successfully
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: postgresem_dev
      PGUSER: postgres
      PGPASSWORD: ${POSTGRES_SUPERUSER_PASSWORD}
      POSTGRESEM_RUNTIME_PASSWORD: ${POSTGRESEM_RUNTIME_PASSWORD}
      POSTGRESEM_AUDIT_WRITER_PASSWORD: ${POSTGRESEM_AUDIT_WRITER_PASSWORD}
      POSTGRESEM_MCP_PROJECT: commerce
      POSTGRESEM_MCP_RUNTIME_URL_ENV: MCP_RUNTIME_DATABASE_URL
      POSTGRESEM_MCP_RUNTIME_PASSWORD_ENV: POSTGRESEM_RUNTIME_PASSWORD
      POSTGRESEM_MCP_AUDIT_URL_ENV: MCP_AUDIT_DATABASE_URL
      POSTGRESEM_MCP_AUDIT_PASSWORD_ENV: POSTGRESEM_AUDIT_WRITER_PASSWORD
      POSTGRESEM_MCP_DB_ROLE_ENV: MCP_MAPPED_DB_ROLE
      MCP_MAPPED_DB_ROLE: postgresem_analyst
      POSTGRESEM_MAX_RESULT_BYTES: "1048576"
      POSTGRESEM_STATEMENT_TIMEOUT_MS: "30000"
      POSTGRESEM_LOCK_TIMEOUT_MS: "5000"
      POSTGRESEM_IDLE_IN_TRANSACTION_SESSION_TIMEOUT_MS: "5000"
    volumes:
      - ./tests/integration:/tests:ro
    entrypoint: ["python3", "/tests/mcp.py"]

  performance-test:
    build:
      context: .
      dockerfile: IntegrationContainerfile
    depends_on:
      seed:
        condition: service_completed_successfully
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: postgresem_dev
      PGUSER: postgres
      PGPASSWORD: ${POSTGRES_SUPERUSER_PASSWORD}
    volumes:
      - ./tests:/tests:ro
    entrypoint: ["python3", "/tests/performance/preview.py"]

  recovery-test:
    build:
      context: .
      dockerfile: IntegrationContainerfile
    depends_on:
      seed:
        condition: service_completed_successfully
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: postgresem_dev
      PGUSER: postgres
      PGPASSWORD: ${POSTGRES_SUPERUSER_PASSWORD}
      POSTGRESEM_RUNTIME_PASSWORD: ${POSTGRESEM_RUNTIME_PASSWORD}
      POSTGRESEM_AUDIT_WRITER_PASSWORD: ${POSTGRESEM_AUDIT_WRITER_PASSWORD}
      POSTGRESEM_MAX_RESULT_BYTES: "1048576"
      POSTGRESEM_STATEMENT_TIMEOUT_MS: "30000"
      POSTGRESEM_LOCK_TIMEOUT_MS: "5000"
      POSTGRESEM_IDLE_IN_TRANSACTION_SESSION_TIMEOUT_MS: "5000"
    volumes:
      - ./fixtures:/fixtures:ro
      - ./migrations:/migrations:ro
      - ./tests:/tests:ro
    entrypoint: ["/bin/sh", "/tests/recovery/run.sh"]

volumes:
  postgres-data:
