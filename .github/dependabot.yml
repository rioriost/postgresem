version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 10
    ignore:
      # postgres 0.19 RowIter implements the fallible-iterator 0.2 trait.
      - dependency-name: fallible-iterator
        versions:
          - 0.3.x
    groups:
      cargo-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:30"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 10
    groups:
      github-actions:
        patterns:
          - "*"
