name: Reference runtime comparison

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/reference-comparison.yml"
      - "tests/reference-comparison/runtime/**"

permissions:
  contents: read

concurrency:
  group: reference-comparison-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime:
    name: ${{ matrix.engine }} on PostgreSQL 18
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        engine:
          - wren
          - cube
          - malloy
          - metricflow
    services:
      postgres:
        image: postgres:18@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
        env:
          POSTGRES_DB: reference
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: reference-superuser
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d reference"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      REFERENCE_DATABASE_HOST: 127.0.0.1
      REFERENCE_DATABASE_PORT: "5432"
      REFERENCE_DATABASE_NAME: reference
      REFERENCE_DATABASE_USER: semantic_user
      REFERENCE_DATABASE_PASSWORD: semantic-runtime
      REFERENCE_DATABASE_IMAGE: postgres:18@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        if: matrix.engine == 'wren' || matrix.engine == 'metricflow'
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false
          version: 0.12.8

      - name: Install Node.js
        if: matrix.engine == 'malloy'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.20.0
          cache: npm
          cache-dependency-path: tests/reference-comparison/runtime/malloy/project/package-lock.json

      - name: Initialize common PostgreSQL dataset
        shell: bash
        run: |
          set -euo pipefail
          docker exec -i \
            "${{ job.services.postgres.id }}" \
            psql \
              --username postgres \
              --dbname reference \
              --set ON_ERROR_STOP=1 \
            < tests/reference-comparison/runtime/postgres/init.sql

      - name: Run pinned reference
        shell: bash
        env:
          REFERENCE_ENGINE: ${{ matrix.engine }}
        run: |
          set -euo pipefail
          mkdir -p runtime-evidence
          "tests/reference-comparison/runtime/run-${REFERENCE_ENGINE}.sh" \
            runtime-evidence

      - name: Upload reference evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reference-${{ matrix.engine }}
          path: runtime-evidence/${{ matrix.engine }}-runtime.json
          if-no-files-found: error
          retention-days: 30
