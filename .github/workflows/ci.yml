name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust quality and tests
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust 1.85 toolchain
        run: |
          rustup toolchain install 1.85.0 \
            --profile minimal \
            --component clippy,rustfmt
          rustup default 1.85.0

      - name: Cache Rust build data
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Run workspace tests
        run: cargo test --locked --workspace --all-features

      - name: Run installer trust-boundary tests
        run: make test-install

      - name: Run Web demo tests
        run: make test-web-demo

      - name: Run reference comparison fixtures
        run: make test-reference-comparison

      - name: Parse JSON schemas
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          schemas = sorted(Path("schemas").rglob("*.json"))
          if not schemas:
              raise SystemExit("no JSON schemas found")

          for schema in schemas:
              with schema.open(encoding="utf-8") as stream:
                  document = json.load(stream)
              if not isinstance(document, dict):
                  raise SystemExit(f"{schema}: schema root must be an object")
              print(f"parsed {schema}")
          PY

  container-compatibility:
    name: Docker, Compose, Podman, and Quadlet
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      COMPOSE_PROJECT_NAME: postgresem-linux-ci
      POSTGRES_SUPERUSER_PASSWORD: ci-superuser-password
      POSTGRESEM_RUNTIME_PASSWORD: ci-runtime-password
      POSTGRESEM_AUDIT_WRITER_PASSWORD: ci-audit-writer-password
      POSTGRESEM_MUTATION_RUNTIME_PASSWORD: ci-mutation-runtime-password
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify Dockerfile and Containerfile parity
        run: cmp Dockerfile Containerfile

      - name: Validate Linux Compose configuration
        run: |
          docker compose \
            -f compose.yaml \
            -f compose.linux.yaml \
            config --quiet

      - name: Start Linux Docker Compose stack
        run: |
          docker compose \
            -f compose.yaml \
            -f compose.linux.yaml \
            up --detach --build gateway

      - name: Verify nonroot Docker Compose gateway
        run: |
          test "$(
            docker compose \
              -f compose.yaml \
              -f compose.linux.yaml \
              exec -T gateway id -u
          )" = "10001"
          docker compose \
            -f compose.yaml \
            -f compose.linux.yaml \
            exec -T gateway postgresem --version

      - name: Validate Quadlet with Podman 4.9
        run: |
          docker run --rm \
            --volume "$PWD:/workspace:ro" \
            --workdir /workspace \
            --entrypoint /bin/sh \
            quay.io/podman/stable:v4.9.3@sha256:cc3563b15b511b3e84d23dc04087cf06df5dee8146c3834c652bd217d4ace1cd \
            -ec 'tests/containers/quadlet.sh deploy/quadlet'

      - name: Install Podman and Quadlet
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends podman

      - name: Build and run Dockerfile with Podman
        run: |
          podman build --file Dockerfile --tag localhost/postgresem:ci .
          test "$(
            podman run --rm \
              --entrypoint /usr/bin/id \
              localhost/postgresem:ci -u
          )" = "10001"
          podman run --rm localhost/postgresem:ci --version

      - name: Validate rootless Quadlet generation
        run: |
          tests/containers/quadlet.sh deploy/quadlet
          HOME="${RUNNER_TEMP}/quadlet-home" deploy/quadlet/install.sh
          test "$(
            stat --format '%a' \
              "${RUNNER_TEMP}/quadlet-home/.config/postgresem/postgresem-database.env"
          )" = "600"
          test "$(
            stat --format '%a' \
              "${RUNNER_TEMP}/quadlet-home/.config/postgresem/postgresem-gateway.env"
          )" = "600"

      - name: Show Compose logs after failure
        if: failure()
        run: |
          docker compose \
            -f compose.yaml \
            -f compose.linux.yaml \
            logs --no-color

      - name: Stop Linux Compose stack
        if: always()
        run: |
          docker compose \
            -f compose.yaml \
            -f compose.linux.yaml \
            down --volumes --remove-orphans

  linux-runtime:
    name: Linux ${{ matrix.arch }} runtime
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    env:
      POSTGRES_SUPERUSER_PASSWORD: ci-superuser-password
      POSTGRESEM_RUNTIME_PASSWORD: ci-runtime-password
      POSTGRESEM_AUDIT_WRITER_PASSWORD: ci-audit-writer-password
      POSTGRESEM_MUTATION_RUNTIME_PASSWORD: ci-mutation-runtime-password
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build native runtime image
        run: docker build --file Dockerfile --tag postgresem:linux-${{ matrix.arch }} .

      - name: Start PostgreSQL 18
        shell: bash
        run: |
          set -euo pipefail
          docker network create postgresem-runtime
          docker run --detach \
            --name postgresem-runtime-db \
            --network postgresem-runtime \
            --network-alias db \
            --env POSTGRES_DB=postgresem_dev \
            --env POSTGRES_USER=postgres \
            --env POSTGRES_PASSWORD="${POSTGRES_SUPERUSER_PASSWORD}" \
            --env POSTGRESEM_RUNTIME_PASSWORD \
            --env POSTGRESEM_AUDIT_WRITER_PASSWORD \
            --env POSTGRESEM_MUTATION_RUNTIME_PASSWORD \
            --volume "$PWD/fixtures/postgres:/docker-entrypoint-initdb.d:ro" \
            --volume "$PWD/migrations:/migrations:ro" \
            --volume "$PWD/fixtures/semantic:/semantic:ro" \
            postgres:18
          for attempt in $(seq 1 60); do
            if docker exec postgresem-runtime-db \
              pg_isready -U postgres -d postgresem_dev >/dev/null 2>&1
            then
              exit 0
            fi
            sleep 2
          done
          docker logs postgresem-runtime-db
          exit 1

      - name: Apply migrations and publish fixture
        run: |
          docker exec \
            --env PGHOST=127.0.0.1 \
            --env PGPORT=5432 \
            --env PGDATABASE=postgresem_dev \
            --env PGUSER=postgres \
            --env PGPASSWORD="${POSTGRES_SUPERUSER_PASSWORD}" \
            postgresem-runtime-db sh /migrations/run.sh
          docker exec \
            --env PGHOST=127.0.0.1 \
            --env PGPORT=5432 \
            --env PGDATABASE=postgresem_dev \
            --env PGUSER=postgres \
            --env PGPASSWORD="${POSTGRES_SUPERUSER_PASSWORD}" \
            postgresem-runtime-db sh /semantic/run.sh

      - name: Run native runtime smoke
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime-evidence
          docker run --rm \
            --network postgresem-runtime \
            --entrypoint /bin/sh \
            --env PGHOST=db \
            --env PGPORT=5432 \
            --env PGDATABASE=postgresem_dev \
            --env POSTGRESEM_EXPECTED_ARCH=${{ matrix.arch }} \
            --env POSTGRESEM_RUNTIME_PASSWORD \
            --env POSTGRESEM_AUDIT_WRITER_PASSWORD \
            --env POSTGRESEM_MUTATION_RUNTIME_PASSWORD \
            --volume "$PWD/tests:/tests:ro" \
            postgresem:linux-${{ matrix.arch }} \
            /tests/runtime/linux-smoke.sh |
            tee "runtime-evidence/linux-${{ matrix.arch }}.json"

      - name: Upload runtime evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-runtime-${{ matrix.arch }}
          path: runtime-evidence/*.json
          if-no-files-found: error
          retention-days: 14

      - name: Show runtime logs after failure
        if: failure()
        run: docker logs postgresem-runtime-db

      - name: Stop runtime services
        if: always()
        run: |
          docker rm --force postgresem-runtime-db >/dev/null 2>&1 || true
          docker network rm postgresem-runtime >/dev/null 2>&1 || true

  postgres:
    name: PostgreSQL ${{ matrix.postgres }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        postgres: ["16", "17", "18"]
    env:
      COMPOSE_FILE: compose.yaml:compose.ci.yaml
      COMPOSE_PROJECT_NAME: postgresem-ci-${{ matrix.postgres }}
      POSTGRES_IMAGE: postgres:${{ matrix.postgres }}
      POSTGRES_VERSION: ${{ matrix.postgres }}
      POSTGRES_SUPERUSER_PASSWORD: ci-superuser-password
      POSTGRESEM_RUNTIME_PASSWORD: ci-runtime-password
      POSTGRESEM_AUDIT_WRITER_PASSWORD: ci-audit-writer-password
      POSTGRESEM_MUTATION_RUNTIME_PASSWORD: ci-mutation-runtime-password
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Start PostgreSQL
        run: docker compose up --detach --wait --wait-timeout 120 db

      - name: Build integration images
        run: docker compose build execution-test mcp-test mutation-test performance-test recovery-test

      - name: Apply migrations
        run: docker compose run --rm --no-deps migrate

      - name: Publish semantic fixture
        run: docker compose run --rm --no-deps seed

      - name: Run database integration checks
        run: docker compose run --rm --no-deps integration-test

      - name: Run guarded execution integration checks
        run: docker compose run --rm --no-deps execution-test

      - name: Run MCP integration checks
        run: docker compose run --rm --no-deps mcp-test

      - name: Run governed mutation integration checks
        run: docker compose run --rm --no-deps mutation-test

      - name: Run developer-preview performance checks
        if: matrix.postgres == '18'
        run: docker compose run --rm --no-deps performance-test

      - name: Run N-1 migration and recovery checks
        run: docker compose run --rm --no-deps recovery-test

      - name: Show service logs after failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop integration services
        if: always()
        run: docker compose down --volumes --remove-orphans
