name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust quality and tests
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust 1.85 toolchain
        run: |
          rustup toolchain install 1.85.0 \
            --profile minimal \
            --component clippy,rustfmt
          rustup default 1.85.0

      - name: Cache Rust build data
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Run workspace tests
        run: cargo test --locked --workspace --all-features

      - name: Parse JSON schemas
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          schemas = sorted(Path("schemas").rglob("*.json"))
          if not schemas:
              raise SystemExit("no JSON schemas found")

          for schema in schemas:
              with schema.open(encoding="utf-8") as stream:
                  document = json.load(stream)
              if not isinstance(document, dict):
                  raise SystemExit(f"{schema}: schema root must be an object")
              print(f"parsed {schema}")
          PY

  container:
    name: Container build
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build runtime image
        run: docker build --file Containerfile --tag postgresem:ci .

  postgres:
    name: PostgreSQL ${{ matrix.postgres }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        postgres: ["16", "17", "18"]
    env:
      COMPOSE_FILE: compose.yaml:compose.ci.yaml
      COMPOSE_PROJECT_NAME: postgresem-ci-${{ matrix.postgres }}
      POSTGRES_IMAGE: postgres:${{ matrix.postgres }}
      POSTGRES_VERSION: ${{ matrix.postgres }}
      POSTGRES_SUPERUSER_PASSWORD: ci-superuser-password
      POSTGRESEM_RUNTIME_PASSWORD: ci-runtime-password
      POSTGRESEM_AUDIT_WRITER_PASSWORD: ci-audit-writer-password
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Start PostgreSQL
        run: docker compose up --detach --wait --wait-timeout 120 db

      - name: Build integration images
        run: docker compose build execution-test mcp-test performance-test recovery-test

      - name: Apply migrations
        run: docker compose run --rm --no-deps migrate

      - name: Publish semantic fixture
        run: docker compose run --rm --no-deps seed

      - name: Run database integration checks
        run: docker compose run --rm --no-deps integration-test

      - name: Run guarded execution integration checks
        run: docker compose run --rm --no-deps execution-test

      - name: Run MCP integration checks
        run: docker compose run --rm --no-deps mcp-test

      - name: Run developer-preview performance checks
        if: matrix.postgres == '18'
        run: docker compose run --rm --no-deps performance-test

      - name: Run N-1 migration and recovery checks
        run: docker compose run --rm --no-deps recovery-test

      - name: Show service logs after failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop integration services
        if: always()
        run: docker compose down --volumes --remove-orphans
