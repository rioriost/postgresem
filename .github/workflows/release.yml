name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  metadata:
    name: Verify release metadata
    runs-on: ubuntu-24.04
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Match tag and workspace version
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import pathlib
          import tomllib

          manifest = tomllib.loads(pathlib.Path("Cargo.toml").read_text(encoding="utf-8"))
          version = manifest["workspace"]["package"]["version"]
          tag = os.environ["GITHUB_REF_NAME"]
          if tag != f"v{version}":
              raise SystemExit(f"tag {tag!r} does not match workspace version {version!r}")
          print(f"verified release version {version}")
          PY

      - name: Verify frozen RC contracts
        run: python3 tests/contracts/verify.py

  binaries:
    name: ${{ matrix.asset_os }} ${{ matrix.asset_arch }}
    needs: metadata
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            asset_os: linux
            asset_arch: amd64
          - runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            asset_os: linux
            asset_arch: arm64
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            asset_os: darwin
            asset_arch: amd64
          - runner: macos-15
            target: aarch64-apple-darwin
            asset_os: darwin
            asset_arch: arm64
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust 1.85 toolchain
        shell: bash
        run: |
          rustup toolchain install 1.85.0 \
            --profile minimal \
            --target "${{ matrix.target }}"
          rustup default 1.85.0

      - name: Build release binary
        shell: bash
        run: |
          set -euo pipefail
          cargo build \
            --locked \
            --release \
            --package postgresem \
            --target "${{ matrix.target }}"

      - name: Package release archive
        shell: bash
        env:
          ASSET_ARCH: ${{ matrix.asset_arch }}
          ASSET_OS: ${{ matrix.asset_os }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail

          version="${GITHUB_REF_NAME#v}"
          archive="postgresem-${version}-${ASSET_OS}-${ASSET_ARCH}"
          root="dist/${archive}"
          source_date_epoch="$(git show -s --format=%ct "${GITHUB_SHA}")"

          mkdir -p "${root}/contracts"
          mkdir -p "${root}/docs"
          mkdir -p "${root}/schemas"
          install -m 0755 \
            "target/${TARGET}/release/postgresem" \
            "${root}/postgresem"
          cp -R schemas/. "${root}/schemas/"
          cp -R contracts/. "${root}/contracts/"
          cp docs/compatibility.md docs/deprecation-policy.md \
            docs/m11-release-candidate-checklist.md \
            docs/rc-operator-workflow.md \
            "${root}/docs/"
          cp CHANGELOG.md GOVERNANCE.md LICENSE README.md SECURITY.md SUPPORT.md \
            "${root}/"

          python3 - "${root}" "dist/${archive}.tar.gz" \
            "${source_date_epoch}" <<'PY'
          import gzip
          import pathlib
          import sys
          import tarfile

          root = pathlib.Path(sys.argv[1])
          output = pathlib.Path(sys.argv[2])
          epoch = int(sys.argv[3])
          paths = [root, *sorted(root.rglob("*"), key=lambda path: path.as_posix())]

          with output.open("wb") as raw:
              with gzip.GzipFile(
                  filename="",
                  mode="wb",
                  fileobj=raw,
                  compresslevel=9,
                  mtime=epoch,
              ) as compressed:
                  with tarfile.open(
                      fileobj=compressed,
                      mode="w",
                      format=tarfile.USTAR_FORMAT,
                  ) as archive:
                      for path in paths:
                          if path.is_symlink():
                              raise SystemExit(f"refusing to package symlink: {path}")
                          name = path.relative_to(root.parent).as_posix()
                          info = archive.gettarinfo(str(path), arcname=name)
                          info.uid = 0
                          info.gid = 0
                          info.uname = "root"
                          info.gname = "root"
                          info.mtime = epoch
                          info.mode = (
                              0o755
                              if path.is_dir() or path.name == "postgresem"
                              else 0o644
                          )
                          if path.is_file():
                              with path.open("rb") as stream:
                                  archive.addfile(info, stream)
                          else:
                              archive.addfile(info)
          PY

      - name: Smoke packaged binary
        shell: bash
        env:
          ASSET_ARCH: ${{ matrix.asset_arch }}
          ASSET_OS: ${{ matrix.asset_os }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          archive="postgresem-${version}-${ASSET_OS}-${ASSET_ARCH}"
          mkdir -p dist/smoke
          tar -xzf "dist/${archive}.tar.gz" -C dist/smoke
          test -x "dist/smoke/${archive}/postgresem"
          "dist/smoke/${archive}/postgresem" --version
          "dist/smoke/${archive}/postgresem" contract show \
            >dist/smoke/contract.json
          cmp \
            <(python3 -c 'import json; print(json.dumps(json.load(open("contracts/rc-v1.json"))["manifest"], sort_keys=True))') \
            <(python3 -c 'import json; print(json.dumps(json.load(open("dist/smoke/contract.json")), sort_keys=True))')

      - name: Start Linux release smoke database
        if: matrix.asset_os == 'linux'
        shell: bash
        env:
          POSTGRES_SUPERUSER_PASSWORD: release-superuser-password
          POSTGRESEM_RUNTIME_PASSWORD: release-runtime-password
          POSTGRESEM_AUDIT_WRITER_PASSWORD: release-audit-writer-password
          POSTGRESEM_MUTATION_RUNTIME_PASSWORD: release-mutation-runtime-password
        run: |
          set -euo pipefail
          docker network create postgresem-release
          docker run --detach \
            --name postgresem-release-db \
            --network postgresem-release \
            --publish 127.0.0.1:55432:5432 \
            --env POSTGRES_DB=postgresem_dev \
            --env POSTGRES_USER=postgres \
            --env POSTGRES_PASSWORD="${POSTGRES_SUPERUSER_PASSWORD}" \
            --env POSTGRESEM_RUNTIME_PASSWORD \
            --env POSTGRESEM_AUDIT_WRITER_PASSWORD \
            --env POSTGRESEM_MUTATION_RUNTIME_PASSWORD \
            --volume "$PWD/fixtures/postgres:/docker-entrypoint-initdb.d:ro" \
            --volume "$PWD/migrations:/migrations:ro" \
            --volume "$PWD/fixtures/semantic:/semantic:ro" \
            postgres:18
          for attempt in $(seq 1 60); do
            if docker exec postgresem-release-db \
              pg_isready -U postgres -d postgresem_dev >/dev/null 2>&1
            then
              break
            fi
            if [ "$attempt" = 60 ]; then
              docker logs postgresem-release-db
              exit 1
            fi
            sleep 2
          done
          docker exec \
            --env PGHOST=127.0.0.1 \
            --env PGPORT=5432 \
            --env PGDATABASE=postgresem_dev \
            --env PGUSER=postgres \
            --env PGPASSWORD="${POSTGRES_SUPERUSER_PASSWORD}" \
            postgresem-release-db sh /migrations/run.sh
          docker exec \
            --env PGHOST=127.0.0.1 \
            --env PGPORT=5432 \
            --env PGDATABASE=postgresem_dev \
            --env PGUSER=postgres \
            --env PGPASSWORD="${POSTGRES_SUPERUSER_PASSWORD}" \
            postgresem-release-db sh /semantic/run.sh

      - name: Run packaged Linux runtime smoke
        if: matrix.asset_os == 'linux'
        shell: bash
        env:
          ASSET_ARCH: ${{ matrix.asset_arch }}
          POSTGRESEM_RUNTIME_PASSWORD: release-runtime-password
          POSTGRESEM_AUDIT_WRITER_PASSWORD: release-audit-writer-password
          POSTGRESEM_MUTATION_RUNTIME_PASSWORD: release-mutation-runtime-password
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          archive="postgresem-${version}-linux-${ASSET_ARCH}"
          export PATH="$PWD/dist/smoke/${archive}:$PATH"
          export PGHOST=127.0.0.1
          export PGPORT=55432
          export PGDATABASE=postgresem_dev
          export POSTGRESEM_EXPECTED_ARCH="${ASSET_ARCH}"
          export POSTGRESEM_TEST_ROOT="$PWD/tests"
          export POSTGRESEM_EVIDENCE_FILE="$PWD/dist/linux-${ASSET_ARCH}-runtime.json"
          tests/runtime/linux-smoke.sh

      - name: Stop Linux release smoke database
        if: always() && matrix.asset_os == 'linux'
        run: |
          docker rm --force postgresem-release-db >/dev/null 2>&1 || true
          docker network rm postgresem-release >/dev/null 2>&1 || true

      - name: Upload release archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.asset_os }}-${{ matrix.asset_arch }}
          path: |
            dist/*.tar.gz
            dist/*-runtime.json
          if-no-files-found: error
          retention-days: 7

  checksums:
    name: Generate checksums
    needs:
      - binaries
      - image-smoke
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download release archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Generate SHA256SUMS
        run: |
          set -eu
          cd dist
          sha256sum ./*.tar.gz ./*-runtime.json |
            sed 's#  \./#  #' > SHA256SUMS

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v2.6.5

      - name: Sign checksums with GitHub OIDC
        working-directory: dist
        run: |
          cosign sign-blob --yes \
            --output-signature SHA256SUMS.sig \
            --output-certificate SHA256SUMS.pem \
            SHA256SUMS

      - name: Upload checksums
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-checksums
          path: |
            dist/SHA256SUMS
            dist/SHA256SUMS.sig
            dist/SHA256SUMS.pem
          if-no-files-found: error
          retention-days: 7

  github-release:
    name: Publish GitHub release
    needs:
      - checksums
      - image
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download release files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}

  image-smoke:
    name: Linux ${{ matrix.arch }} image smoke
    needs: metadata
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: amd64
          - runner: ubuntu-22.04-arm
            arch: arm64
    env:
      POSTGRES_SUPERUSER_PASSWORD: release-superuser-password
      POSTGRESEM_RUNTIME_PASSWORD: release-runtime-password
      POSTGRESEM_AUDIT_WRITER_PASSWORD: release-audit-writer-password
      POSTGRESEM_MUTATION_RUNTIME_PASSWORD: release-mutation-runtime-password
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build native release image
        run: docker build --file Dockerfile --tag postgresem:image-smoke .

      - name: Start PostgreSQL 18
        shell: bash
        run: |
          set -euo pipefail
          docker network create postgresem-image-smoke
          docker run --detach \
            --name postgresem-image-smoke-db \
            --network postgresem-image-smoke \
            --network-alias db \
            --env POSTGRES_DB=postgresem_dev \
            --env POSTGRES_USER=postgres \
            --env POSTGRES_PASSWORD="${POSTGRES_SUPERUSER_PASSWORD}" \
            --env POSTGRESEM_RUNTIME_PASSWORD \
            --env POSTGRESEM_AUDIT_WRITER_PASSWORD \
            --env POSTGRESEM_MUTATION_RUNTIME_PASSWORD \
            --volume "$PWD/fixtures/postgres:/docker-entrypoint-initdb.d:ro" \
            --volume "$PWD/migrations:/migrations:ro" \
            --volume "$PWD/fixtures/semantic:/semantic:ro" \
            postgres:18
          for attempt in $(seq 1 60); do
            if docker exec postgresem-image-smoke-db \
              pg_isready -U postgres -d postgresem_dev >/dev/null 2>&1
            then
              exit 0
            fi
            sleep 2
          done
          docker logs postgresem-image-smoke-db
          exit 1

      - name: Apply migrations and publish fixture
        run: |
          docker exec \
            --env PGHOST=127.0.0.1 \
            --env PGPORT=5432 \
            --env PGDATABASE=postgresem_dev \
            --env PGUSER=postgres \
            --env PGPASSWORD="${POSTGRES_SUPERUSER_PASSWORD}" \
            postgresem-image-smoke-db sh /migrations/run.sh
          docker exec \
            --env PGHOST=127.0.0.1 \
            --env PGPORT=5432 \
            --env PGDATABASE=postgresem_dev \
            --env PGUSER=postgres \
            --env PGPASSWORD="${POSTGRES_SUPERUSER_PASSWORD}" \
            postgresem-image-smoke-db sh /semantic/run.sh

      - name: Run native image smoke
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime-evidence
          docker run --rm \
            --network postgresem-image-smoke \
            --entrypoint /bin/sh \
            --env PGHOST=db \
            --env PGPORT=5432 \
            --env PGDATABASE=postgresem_dev \
            --env POSTGRESEM_EXPECTED_ARCH=${{ matrix.arch }} \
            --env POSTGRESEM_RUNTIME_PASSWORD \
            --env POSTGRESEM_AUDIT_WRITER_PASSWORD \
            --env POSTGRESEM_MUTATION_RUNTIME_PASSWORD \
            --volume "$PWD/tests:/tests:ro" \
            postgresem:image-smoke \
            /tests/runtime/linux-smoke.sh |
            tee "runtime-evidence/linux-${{ matrix.arch }}-image-runtime.json"

      - name: Upload image runtime evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-image-runtime-${{ matrix.arch }}
          path: runtime-evidence/*.json
          if-no-files-found: error
          retention-days: 14

      - name: Show runtime logs after failure
        if: failure()
        run: docker logs postgresem-image-smoke-db

      - name: Stop runtime services
        if: always()
        run: |
          docker rm --force postgresem-image-smoke-db >/dev/null 2>&1 || true
          docker network rm postgresem-image-smoke >/dev/null 2>&1 || true

  image:
    name: Publish multi-architecture image
    needs:
      - metadata
      - image-smoke
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Normalize image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ !contains(github.ref_name, '-') }}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          provenance: mode=max
          sbom: true

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v2.6.5

      - name: Sign image with GitHub OIDC
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
